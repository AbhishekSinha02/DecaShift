<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Speed lines (rushing from right to left) -->
  <line x1="8" y1="100" x2="45" y2="100" stroke="#22D3EE" stroke-width="2" opacity="0.50"/>
  <line x1="5" y1="115" x2="38" y2="115" stroke="#22D3EE" stroke-width="1.5" opacity="0.38"/>
  <line x1="8" y1="130" x2="40" y2="130" stroke="#22D3EE" stroke-width="1" opacity="0.30"/>
  <line x1="10" y1="85" x2="42" y2="85" stroke="#22D3EE" stroke-width="1" opacity="0.30"/>

  <!-- Staff trailing sparks -->
  <circle cx="155" cy="48" r="3" fill="#22D3EE" opacity="0.75"/>
  <circle cx="163" cy="55" r="2" fill="#F59E0B" opacity="0.65"/>
  <circle cx="160" cy="42" r="2.5" fill="#22D3EE" opacity="0.55"/>

  <!-- Body (leaning forward — running pose) -->
  <ellipse cx="108" cy="158" rx="28" ry="20" fill="#4C3D6E" transform="rotate(-12 108 158)"/>
  <ellipse cx="108" cy="158" rx="15" ry="11" fill="#F5E6C8" transform="rotate(-12 108 158)"/>

  <!-- Left arm (pumping back) -->
  <ellipse cx="75" cy="165" rx="8" ry="18" fill="#4C3D6E" transform="rotate(30 75 165)"/>
  <!-- Right arm (pushing forward, holding staff) -->
  <ellipse cx="135" cy="140" rx="8" ry="18" fill="#4C3D6E" transform="rotate(-25 135 140)"/>

  <!-- STAFF (held forward at angle, trailing glow) -->
  <rect x="130" y="28" width="6" height="130" rx="3" fill="#7C4A1E" transform="rotate(-18 133 93)"/>
  <ellipse cx="148" cy="30" rx="6" ry="6" fill="#22D3EE" opacity="0.80"/>

  <!-- Legs (running — asymmetric) -->
  <ellipse cx="85" cy="178" rx="13" ry="9" fill="#4C3D6E" transform="rotate(-15 85 178)"/>
  <ellipse cx="118" cy="175" rx="13" ry="9" fill="#4C3D6E" transform="rotate(20 118 175)"/>

  <!-- HEAD (tilted forward slightly) -->
  <circle cx="103" cy="74" r="52" fill="#4C3D6E"/>

  <!-- Ears (swept back — wind effect) -->
  <ellipse cx="64" cy="30" rx="11" ry="17" fill="#4C3D6E" transform="rotate(15 64 30)"/>
  <ellipse cx="64" cy="32" rx="6" ry="10" fill="#5D4A80" transform="rotate(15 64 32)"/>
  <ellipse cx="145" cy="27" rx="11" ry="16" fill="#4C3D6E" transform="rotate(20 145 27)"/>
  <ellipse cx="145" cy="29" rx="6" ry="9" fill="#5D4A80" transform="rotate(20 145 29)"/>

  <!-- Snout -->
  <ellipse cx="103" cy="93" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (squinted, focused — speed) -->
  <ellipse cx="86" cy="71" rx="13" ry="9" fill="#F59E0B"/>
  <path d="M 73 65 Q 86 62 99 65" stroke="#4C3D6E" stroke-width="3" fill="none"/>
  <ellipse cx="86" cy="72" rx="7" ry="6" fill="#1E1B4B"/>
  <circle cx="89" cy="69" r="2.5" fill="white" opacity="0.9"/>

  <ellipse cx="120" cy="71" rx="13" ry="9" fill="#F59E0B"/>
  <path d="M 107 65 Q 120 62 133 65" stroke="#4C3D6E" stroke-width="3" fill="none"/>
  <ellipse cx="120" cy="72" rx="7" ry="6" fill="#1E1B4B"/>
  <circle cx="123" cy="69" r="2.5" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="103" cy="90" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (determined, tight grin) -->
  <path d="M 95 100 Q 105 106 111 101" stroke="#3D2B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bandana (flowing back in wind) -->
  <rect x="77" y="120" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 129 120 L 140 116 L 138 124 L 129 129 Z" fill="#C0392B" opacity="0.85"/>
</svg>
