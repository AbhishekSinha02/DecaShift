<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Electricity sparks around body -->
  <path d="M 55 130 L 62 122 L 58 118 L 66 110" stroke="#22D3EE" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 30 155 L 38 148 L 34 143" stroke="#22D3EE" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.60"/>
  <circle cx="42" cy="105" r="2.5" fill="#22D3EE" opacity="0.70"/>
  <circle cx="28" cy="130" r="2" fill="#F59E0B" opacity="0.65"/>

  <!-- Body -->
  <ellipse cx="100" cy="157" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="157" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- Arms -->
  <ellipse cx="68" cy="152" rx="8" ry="17" fill="#4C3D6E" transform="rotate(-22 68 152)"/>
  <ellipse cx="134" cy="148" rx="8" ry="18" fill="#4C3D6E" transform="rotate(10 134 148)"/>

  <!-- Legs -->
  <ellipse cx="87" cy="177" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="177" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- STAFF (both tips glowing) -->
  <rect x="145" y="30" width="6" height="145" rx="3" fill="#7C4A1E"/>

  <!-- Top glowing tip -->
  <ellipse cx="148" cy="30" rx="8" ry="8" fill="#22D3EE" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="148" cy="30" rx="4" ry="4" fill="white" opacity="0.9"/>

  <!-- Bottom glowing tip -->
  <ellipse cx="148" cy="175" rx="8" ry="8" fill="#22D3EE" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="148" cy="175" rx="4" ry="4" fill="white" opacity="0.9"/>

  <!-- Staff body subtle glow -->
  <rect x="145" y="30" width="6" height="145" rx="3" fill="#22D3EE" opacity="0.12" filter="url(#softGlow)"/>

  <!-- HEAD -->
  <circle cx="100" cy="75" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="32" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="32" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="94" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (intense — strong brow line, sharp pupils) -->
  <ellipse cx="83" cy="73" rx="13" ry="11" fill="#F59E0B"/>
  <path d="M 69 64 Q 83 60 97 64" stroke="#3D2B5E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="84" cy="74" rx="7.5" ry="8" fill="#1E1B4B"/>
  <circle cx="87" cy="70" r="2.5" fill="white" opacity="0.9"/>
  <!-- Slight eye glow -->
  <ellipse cx="83" cy="73" rx="13" ry="11" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5" filter="url(#softGlow)"/>

  <ellipse cx="117" cy="73" rx="13" ry="11" fill="#F59E0B"/>
  <path d="M 103 64 Q 117 60 131 64" stroke="#3D2B5E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="118" cy="74" rx="7.5" ry="8" fill="#1E1B4B"/>
  <circle cx="121" cy="70" r="2.5" fill="white" opacity="0.9"/>
  <ellipse cx="117" cy="73" rx="13" ry="11" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Nose -->
  <ellipse cx="100" cy="91" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (confident, slight smirk) -->
  <path d="M 93 101 Q 103 107 109 102" stroke="#3D2B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bandana -->
  <rect x="74" y="120" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 120 L 133 129 L 126 129" fill="#C0392B"/>
</svg>
