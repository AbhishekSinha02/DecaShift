<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tipGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Subtle speed lines behind body -->
  <line x1="20" y1="150" x2="55" y2="150" stroke="#4C3D6E" stroke-width="1.5" opacity="0.4"/>
  <line x1="18" y1="160" x2="50" y2="160" stroke="#4C3D6E" stroke-width="1" opacity="0.3"/>

  <!-- Body -->
  <ellipse cx="100" cy="157" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="157" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- Left arm -->
  <ellipse cx="68" cy="153" rx="8" ry="17" fill="#4C3D6E" transform="rotate(-18 68 153)"/>
  <!-- Right arm (gripping staff) -->
  <ellipse cx="134" cy="148" rx="8" ry="18" fill="#4C3D6E" transform="rotate(10 134 148)"/>

  <!-- Legs -->
  <ellipse cx="87" cy="177" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="177" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- STAFF (wood body) -->
  <rect x="145" y="35" width="6" height="140" rx="3" fill="#7C4A1E"/>

  <!-- ONE glowing tip (bottom) -->
  <ellipse cx="148" cy="175" rx="7" ry="7" fill="#22D3EE" opacity="0.9" filter="url(#tipGlow)"/>
  <ellipse cx="148" cy="175" rx="4" ry="4" fill="white" opacity="0.85"/>

  <!-- HEAD -->
  <circle cx="100" cy="75" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="32" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="32" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="94" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (determined — slightly flattened top) -->
  <ellipse cx="83" cy="72" rx="13" ry="11" fill="#F59E0B"/>
  <path d="M 70 65 Q 83 62 96 65" stroke="#4C3D6E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="84" cy="74" r="7" fill="#1E1B4B"/>
  <circle cx="87" cy="70" r="2.5" fill="white" opacity="0.9"/>

  <ellipse cx="117" cy="72" rx="13" ry="11" fill="#F59E0B"/>
  <path d="M 104 65 Q 117 62 130 65" stroke="#4C3D6E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="118" cy="74" r="7" fill="#1E1B4B"/>
  <circle cx="121" cy="70" r="2.5" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="100" cy="91" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (thin, determined line) -->
  <path d="M 92 101 Q 100 104 108 101" stroke="#3D2B5E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Bandana -->
  <rect x="74" y="120" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 120 L 133 129 L 126 129" fill="#C0392B"/>
</svg>
