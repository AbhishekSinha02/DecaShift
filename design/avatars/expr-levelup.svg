<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background burst -->
  <circle cx="100" cy="95" r="95" fill="url(#burst)"/>

  <!-- Stars / sparkles all around -->
  <path d="M 22 45 L 25 37 L 28 45 L 36 48 L 28 51 L 25 59 L 22 51 L 14 48 Z" fill="#F59E0B" opacity="0.80"/>
  <path d="M 162 35 L 165 27 L 168 35 L 176 38 L 168 41 L 165 49 L 162 41 L 154 38 Z" fill="#22D3EE" opacity="0.75"/>
  <path d="M 12 140 L 14 135 L 16 140 L 21 142 L 16 144 L 14 149 L 12 144 L 7 142 Z" fill="#22D3EE" opacity="0.65"/>
  <path d="M 174 155 L 176 150 L 178 155 L 183 157 L 178 159 L 176 164 L 174 159 L 169 157 Z" fill="#F59E0B" opacity="0.65"/>
  <circle cx="38" cy="25" r="4" fill="#22D3EE" opacity="0.70" filter="url(#glow)"/>
  <circle cx="162" cy="170" r="4" fill="#F59E0B" opacity="0.65" filter="url(#glow)"/>
  <circle cx="178" cy="88" r="3" fill="#22D3EE" opacity="0.60"/>

  <!-- Body (jumping — lifted upward) -->
  <ellipse cx="100" cy="150" rx="28" ry="21" fill="#4C3D6E"/>
  <ellipse cx="100" cy="150" rx="15" ry="12" fill="#F5E6C8"/>

  <!-- Both arms thrown wide up -->
  <ellipse cx="62" cy="122" rx="8" ry="20" fill="#4C3D6E" transform="rotate(-55 62 122)"/>
  <ellipse cx="138" cy="122" rx="8" ry="20" fill="#4C3D6E" transform="rotate(55 138 122)"/>

  <!-- Staff — full glow overhead -->
  <rect x="92" y="12" width="6" height="90" rx="3" fill="#7C4A1E"/>
  <rect x="92" y="12" width="6" height="90" rx="3" fill="#22D3EE" opacity="0.5" filter="url(#glow)"/>
  <circle cx="95" cy="12" r="9" fill="#22D3EE" opacity="0.90" filter="url(#glow)"/>
  <circle cx="95" cy="12" r="5" fill="white" opacity="0.95"/>

  <!-- Legs (in air, slightly bent) -->
  <ellipse cx="87" cy="170" rx="11" ry="9" fill="#4C3D6E" transform="rotate(15 87 170)"/>
  <ellipse cx="113" cy="170" rx="11" ry="9" fill="#4C3D6E" transform="rotate(-15 113 170)"/>

  <!-- HEAD -->
  <circle cx="100" cy="72" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="27" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="29" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="27" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="29" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="91" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (wide open, excited — star pupils) -->
  <circle cx="83" cy="68" r="15" fill="#F59E0B"/>
  <circle cx="83" cy="68" r="15" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <!-- Star pupil left -->
  <path d="M 83 60 L 85 66 L 91 68 L 85 70 L 83 76 L 81 70 L 75 68 L 81 66 Z" fill="#1E1B4B"/>
  <circle cx="87" cy="64" r="2.5" fill="white" opacity="0.9"/>

  <circle cx="117" cy="68" r="15" fill="#F59E0B"/>
  <circle cx="117" cy="68" r="15" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <!-- Star pupil right -->
  <path d="M 117 60 L 119 66 L 125 68 L 119 70 L 117 76 L 115 70 L 109 68 L 115 66 Z" fill="#1E1B4B"/>
  <circle cx="121" cy="64" r="2.5" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="100" cy="88" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Big excited grin -->
  <path d="M 84 98 Q 100 114 116 98" stroke="#3D2B5E" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Blush (excitement) -->
  <ellipse cx="66" cy="86" rx="10" ry="6" fill="#E8A4A4" opacity="0.45"/>
  <ellipse cx="134" cy="86" rx="10" ry="6" fill="#E8A4A4" opacity="0.45"/>

  <!-- Bandana -->
  <rect x="74" y="117" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 117 L 133 126 L 126 126" fill="#C0392B"/>
</svg>
