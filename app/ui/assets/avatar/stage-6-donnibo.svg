<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aura" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="staffGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full violet aura -->
  <circle cx="100" cy="115" r="95" fill="url(#aura)"/>

  <!-- Floating electricity particles -->
  <circle cx="35" cy="80" r="3" fill="#22D3EE" opacity="0.70" filter="url(#softGlow)"/>
  <circle cx="22" cy="130" r="2.5" fill="#7C3AED" opacity="0.65"/>
  <circle cx="170" cy="90" r="3" fill="#22D3EE" opacity="0.65" filter="url(#softGlow)"/>
  <circle cx="178" cy="150" r="2" fill="#F59E0B" opacity="0.60"/>
  <circle cx="55" cy="175" r="2.5" fill="#22D3EE" opacity="0.55"/>
  <path d="M 28 95 L 36 88 L 31 83" stroke="#22D3EE" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.70"/>
  <path d="M 165 115 L 172 108 L 168 103" stroke="#22D3EE" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Body -->
  <ellipse cx="100" cy="157" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="157" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- Arms -->
  <ellipse cx="68" cy="153" rx="8" ry="17" fill="#4C3D6E" transform="rotate(-18 68 153)"/>
  <ellipse cx="134" cy="148" rx="8" ry="18" fill="#4C3D6E" transform="rotate(10 134 148)"/>

  <!-- Legs -->
  <ellipse cx="87" cy="177" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="177" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- STAFF — fully electrified -->
  <rect x="145" y="22" width="6" height="155" rx="3" fill="url(#staffGlow)" filter="url(#strongGlow)"/>
  <rect x="146.5" y="22" width="3" height="155" rx="1.5" fill="white" opacity="0.35"/>

  <!-- Top tip burst -->
  <circle cx="148" cy="22" r="10" fill="#22D3EE" opacity="0.85" filter="url(#strongGlow)"/>
  <circle cx="148" cy="22" r="5" fill="white" opacity="0.90"/>
  <!-- Bottom tip burst -->
  <circle cx="148" cy="177" r="10" fill="#22D3EE" opacity="0.85" filter="url(#strongGlow)"/>
  <circle cx="148" cy="177" r="5" fill="white" opacity="0.90"/>

  <!-- HEAD -->
  <circle cx="100" cy="75" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="32" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="32" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="94" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (calm, certain — fully open, glow ring around) -->
  <circle cx="83" cy="72" r="13" fill="#F59E0B"/>
  <circle cx="83" cy="72" r="13" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="84" cy="74" r="7.5" fill="#1E1B4B"/>
  <circle cx="87" cy="70" r="3" fill="white" opacity="0.95"/>

  <circle cx="117" cy="72" r="13" fill="#F59E0B"/>
  <circle cx="117" cy="72" r="13" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="118" cy="74" r="7.5" fill="#1E1B4B"/>
  <circle cx="121" cy="70" r="3" fill="white" opacity="0.95"/>

  <!-- Nose -->
  <ellipse cx="100" cy="91" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (calm, knowing smile — the "I already know" expression) -->
  <path d="M 90 100 Q 100 109 110 100" stroke="#3D2B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bandana (glowing version) -->
  <rect x="74" y="120" width="52" height="9" rx="3" fill="#7C3AED"/>
  <rect x="74" y="120" width="52" height="9" rx="3" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
  <path d="M 126 120 L 133 129 L 126 129" fill="#6B2FCC"/>
</svg>
