  <section id="screen-quiz" class="screen">
    <div class="quiz-wrap">

      <div class="quiz-header">
        <span class="quiz-progress-text" id="quiz-progress-text">Question 1 of 10</span>
        <div class="quiz-header-right">
          <button class="btn btn-ghost btn-xs timer-toggle-btn" id="timer-toggle-btn" onclick="toggleTimer()">⏱ Tracking time</button>
          <div class="timer-badge" id="timer-display">00:00</div>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="quiz-progress-fill" style="width:0%"></div>
      </div>

      <div id="quiz-challenge-banner" class="quiz-challenge"></div>

      <div class="question-card">
        <div class="lucky-tag hidden" id="lucky-tag">✨ Lucky Question · 2× XP</div>
        <p class="question-text" id="question-text">
          <span class="skeleton skel-line" aria-hidden="true"></span>
          <span class="skeleton skel-line skel-line-short" aria-hidden="true"></span>
        </p>
      </div>

      <div id="answer-list" class="answer-list"></div>

      <div id="feedback-flash" class="feedback-flash hidden"></div>

      <div id="explanation-box" class="explanation-box hidden"></div>

      <div class="quiz-actions">
        <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled>Submit Answer</button>
        <button class="btn btn-primary hidden" id="next-btn" onclick="nextQuestion()">Next →</button>
      </div>

    </div>
  </section>
