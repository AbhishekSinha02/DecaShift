  <section id="screen-result" class="screen">
    <div class="result-wrap">

      <div id="first-session-banner" class="first-session-banner hidden">
        <span class="fsb-emoji">🎉</span>
        <div class="fsb-body">
          <strong>First session complete!</strong>
          <span>Your daily practice starts now — come back tomorrow to keep it going.</span>
        </div>
      </div>

      <div class="result-hero">
        <p class="result-label">Session Complete</p>
        <div class="result-score-big" id="result-score">— / —</div>
        <div class="result-pct" id="result-pct">—%</div>
        <div class="result-badge" id="result-badge">—</div>
        <div class="result-xp" id="result-xp"></div>
      </div>

      <div id="result-win-message" class="result-win-msg"></div>

      <div id="result-challenge"></div>

      <div id="result-trend"></div>

      <div class="card result-table-wrap">
        <table class="result-table">
          <thead>
            <tr><th>#</th><th>Question</th><th>Result</th><th>Time</th></tr>
          </thead>
          <tbody id="result-table-body"></tbody>
        </table>
      </div>

      <div id="result-next-level"></div>

      <div class="result-actions">
        <button class="btn btn-share"     id="result-share-btn">Share Result</button>
        <button class="btn btn-challenge" id="result-challenge-btn">⚔ Challenge a Friend</button>
        <button class="btn btn-primary"   id="restart-btn">Restart Goal</button>
        <button class="btn btn-ghost"     id="back-home-btn">Back to Goals</button>
      </div>

    </div>
  </section>
