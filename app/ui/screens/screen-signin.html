  <section id="screen-signin" class="screen">
    <div class="auth-wrap">

      <div class="brand">
        <img src="assets/icon.svg" class="brand-logo" alt="DecaShift">
        <h1 class="brand-name">DecaShift</h1>
        <p class="brand-tagline">Practice Daily. Grow Fast.</p>
      </div>

      <div class="card auth-card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue your daily practice</p>

        <form id="signin-form" novalidate autocomplete="on">

          <div class="form-group">
            <label for="si-email">Email Address</label>
            <input type="email" id="si-email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <span class="field-error" id="err-si-email"></span>
          </div>

          <div class="form-group">
            <label for="si-password">Password</label>
            <input type="password" id="si-password" name="password" placeholder="Your password" autocomplete="current-password" required>
            <span class="field-error" id="err-si-password"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="signin-btn">Sign In →</button>

          <p class="auth-switch">New here? <button type="button" class="link-btn" id="btn-to-signup">Create a free account</button></p>

        </form>
      </div>

    </div>
  </section>
