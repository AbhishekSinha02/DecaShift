<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (tiny — chibi proportions) -->
  <ellipse cx="100" cy="167" rx="22" ry="18" fill="#4C3D6E"/>
  <ellipse cx="100" cy="167" rx="12" ry="10" fill="#F5E6C8"/>

  <!-- Arms (small, stubby) -->
  <ellipse cx="75" cy="164" rx="7" ry="13" fill="#4C3D6E" transform="rotate(-18 75 164)"/>
  <ellipse cx="125" cy="163" rx="7" ry="13" fill="#4C3D6E" transform="rotate(12 125 163)"/>

  <!-- Twig (thin, lighter brown — not a real staff yet) -->
  <rect x="141" y="55" width="4" height="118" rx="2" fill="#A07850"/>
  <line x1="141" y1="78" x2="134" y2="68" stroke="#A07850" stroke-width="2" stroke-linecap="round"/>
  <line x1="141" y1="95" x2="148" y2="86" stroke="#A07850" stroke-width="1.5" stroke-linecap="round"/>

  <!-- HEAD (oversized chibi — takes up most of frame) -->
  <circle cx="100" cy="80" r="58" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="56" cy="32" rx="14" ry="18" fill="#4C3D6E"/>
  <ellipse cx="56" cy="34" rx="8" ry="11" fill="#5D4A80"/>
  <ellipse cx="144" cy="32" rx="14" ry="18" fill="#4C3D6E"/>
  <ellipse cx="144" cy="34" rx="8" ry="11" fill="#5D4A80"/>

  <!-- Snout cream patch -->
  <ellipse cx="100" cy="100" rx="20" ry="14" fill="#F5E6C8"/>

  <!-- EYES (huge, wide, curious) -->
  <circle cx="82" cy="76" r="17" fill="#F59E0B"/>
  <circle cx="84" cy="78" r="10" fill="#1E1B4B"/>
  <circle cx="87" cy="73" r="4" fill="white" opacity="0.9"/>

  <circle cx="118" cy="76" r="17" fill="#F59E0B"/>
  <circle cx="120" cy="78" r="10" fill="#1E1B4B"/>
  <circle cx="123" cy="73" r="4" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="100" cy="97" rx="7" ry="5" fill="#3D2B5E"/>

  <!-- Mouth (small curious O shape) -->
  <ellipse cx="100" cy="107" rx="5" ry="4.5" fill="#3D2B5E"/>

  <!-- Blush marks (baby cute) -->
  <ellipse cx="65" cy="91" rx="9" ry="5.5" fill="#E8A4A4" opacity="0.38"/>
  <ellipse cx="135" cy="91" rx="9" ry="5.5" fill="#E8A4A4" opacity="0.38"/>
</svg>
