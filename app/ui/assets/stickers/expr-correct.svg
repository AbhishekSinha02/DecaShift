<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Celebration sparkles -->
  <circle cx="32" cy="55" r="5" fill="#F59E0B" opacity="0.8" filter="url(#sparkle)"/>
  <circle cx="168" cy="48" r="5" fill="#22D3EE" opacity="0.8" filter="url(#sparkle)"/>
  <circle cx="25" cy="115" r="4" fill="#22D3EE" opacity="0.65"/>
  <circle cx="175" cy="120" r="4" fill="#F59E0B" opacity="0.65"/>
  <!-- Star shapes (4-point) -->
  <path d="M 45 30 L 48 22 L 51 30 L 59 33 L 51 36 L 48 44 L 45 36 L 37 33 Z" fill="#F59E0B" opacity="0.75"/>
  <path d="M 152 25 L 155 17 L 158 25 L 166 28 L 158 31 L 155 39 L 152 31 L 144 28 Z" fill="#22D3EE" opacity="0.70"/>

  <!-- Body -->
  <ellipse cx="100" cy="157" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="157" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- BOTH ARMS UP (celebrating) -->
  <ellipse cx="65" cy="128" rx="8" ry="20" fill="#4C3D6E" transform="rotate(-40 65 128)"/>
  <ellipse cx="135" cy="128" rx="8" ry="20" fill="#4C3D6E" transform="rotate(40 135 128)"/>

  <!-- Staff overhead (both hands raised) -->
  <rect x="95" y="18" width="6" height="100" rx="3" fill="#7C4A1E" transform="rotate(-5 98 68)"/>

  <!-- Legs -->
  <ellipse cx="87" cy="177" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="177" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- HEAD -->
  <circle cx="100" cy="78" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="33" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="35" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="33" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="35" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="97" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (happy arcs — ^_^ style) -->
  <path d="M 70 74 Q 83 64 96 74" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 104 74 Q 117 64 130 74" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="94" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Big open smile -->
  <path d="M 85 103 Q 100 118 115 103" stroke="#3D2B5E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 85 103 Q 100 120 115 103" fill="#3D2B5E" opacity="0.15"/>

  <!-- Blush marks (joy) -->
  <ellipse cx="66" cy="92" rx="9" ry="5" fill="#E8A4A4" opacity="0.40"/>
  <ellipse cx="134" cy="92" rx="9" ry="5" fill="#E8A4A4" opacity="0.40"/>

  <!-- Bandana -->
  <rect x="74" y="123" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 123 L 133 132 L 126 132" fill="#C0392B"/>
</svg>
