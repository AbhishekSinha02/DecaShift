<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (slight slump) -->
  <ellipse cx="100" cy="160" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="160" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- Left arm (raised slightly, hand to chin — thinking it over) -->
  <ellipse cx="76" cy="138" rx="8" ry="16" fill="#4C3D6E" transform="rotate(35 76 138)"/>
  <!-- Right arm (hanging lower, slight droop) -->
  <ellipse cx="133" cy="158" rx="8" ry="17" fill="#4C3D6E" transform="rotate(20 133 158)"/>

  <!-- Staff (held low, tip touching ground) -->
  <rect x="140" y="100" width="6" height="82" rx="3" fill="#7C4A1E"/>

  <!-- Legs -->
  <ellipse cx="87" cy="180" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="180" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- HEAD (very slightly tilted — discouraged but gentle) -->
  <circle cx="100" cy="77" r="52" fill="#4C3D6E"/>

  <!-- Ears (one slightly drooping) -->
  <ellipse cx="58" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="32" rx="7" ry="10" fill="#5D4A80"/>
  <!-- Right ear slightly lower/tilted -->
  <ellipse cx="143" cy="35" rx="13" ry="15" fill="#4C3D6E" transform="rotate(10 143 35)"/>
  <ellipse cx="143" cy="37" rx="7" ry="9" fill="#5D4A80" transform="rotate(10 143 37)"/>

  <!-- Snout -->
  <ellipse cx="100" cy="96" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes (soft, slightly sad — oval tilted inward) -->
  <ellipse cx="83" cy="73" rx="13" ry="11" fill="#F59E0B"/>
  <!-- Inner brow raised (sad expression) -->
  <path d="M 72 65 Q 83 68 94 63" stroke="#4C3D6E" stroke-width="2.5" fill="none"/>
  <circle cx="84" cy="75" r="7" fill="#1E1B4B"/>
  <circle cx="87" cy="71" r="2.5" fill="white" opacity="0.85"/>

  <ellipse cx="117" cy="73" rx="13" ry="11" fill="#F59E0B"/>
  <path d="M 106 63 Q 117 68 128 65" stroke="#4C3D6E" stroke-width="2.5" fill="none"/>
  <circle cx="118" cy="75" r="7" fill="#1E1B4B"/>
  <circle cx="121" cy="71" r="2.5" fill="white" opacity="0.85"/>

  <!-- Small tear drop (gentle, encouraging — not devastating) -->
  <ellipse cx="73" cy="88" rx="3" ry="4" fill="#22D3EE" opacity="0.50"/>

  <!-- Nose -->
  <ellipse cx="100" cy="93" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (gentle downward curve — not dramatic) -->
  <path d="M 93 103 Q 100 98 107 103" stroke="#3D2B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bandana -->
  <rect x="74" y="122" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 122 L 133 131 L 126 131" fill="#C0392B"/>
</svg>
