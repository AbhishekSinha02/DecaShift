  <section id="screen-home" class="screen">
    <div class="home-wrap">

      <header class="app-header">
        <div class="app-header-brand">
          <img src="assets/icon.svg" class="app-logo" alt="Donnibo">
          <span class="app-brand-name">Donnibo</span>
        </div>
        <div class="app-header-meta" id="app-header-meta"></div>
        <div class="app-header-right">
          <button class="menu-btn" id="menu-btn" onclick="_openDrawer()" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <div class="avatar-ring-wrap" id="avatar-ring-wrap" onclick="toggleUserMenu()" style="cursor:pointer">
            <svg class="avatar-ring-svg" viewBox="0 0 52 52" fill="none">
              <circle class="avatar-ring-track" cx="26" cy="26" r="22" stroke-width="3"/>
              <circle class="avatar-ring-fill" id="avatar-ring-fill" cx="26" cy="26" r="22"
                      stroke-width="3" stroke-linecap="round" transform="rotate(-90 26 26)"/>
            </svg>
            <div class="user-avatar" id="user-avatar">?</div>
          </div>
          <div class="user-menu hidden" id="user-menu">
            <button class="user-menu-item" onclick="openSettings()">⚙ Settings</button>
            <button class="user-menu-item" onclick="signOut()">Sign Out</button>
          </div>
        </div>
      </header>

      <div class="streak-bar" id="streak-bar">
        <span class="streak-flame-sm">🔥</span>
        <span class="streak-num" id="streak-count">0</span>
        <span class="streak-label-sm">days</span>
        <span class="streak-sep">·</span>
        <span class="streak-stat-val" id="stat-accuracy">—</span>
        <span class="streak-stat-key">accuracy</span>
        <span class="streak-sep">·</span>
        <span class="streak-stat-val" id="stat-sessions">0</span>
        <span class="streak-stat-key">sessions</span>
        <span class="streak-sep">·</span>
        <span class="streak-stat-val" id="stat-time">0m</span>
        <span class="streak-stat-key">practiced</span>
        <span class="streak-best-sm">Best: <strong id="streak-best">0</strong>d</span>
      </div>

      <div id="subject-tabs" class="subject-tabs" style="display:none"></div>

      <div class="home-content" id="home-content">
        <div id="today-card-wrap"></div>
        <div id="reward-notif-wrap"></div>

      <!-- Flash Drills Section -->
      <div class="flash-drill-section" id="flash-drill-section">
        <div class="flash-drill-header">
          <span class="flash-drill-title">⚡ Flash Drills</span>
          <span class="flash-drill-sub">Quick 2-min memory sessions</span>
        </div>
        <div class="flash-drill-pills">
          <button class="drill-pill" onclick="_startDrill('tables')">×&nbsp; Tables</button>
          <button class="drill-pill" onclick="_startDrill('squares')">²&nbsp; Squares</button>
          <button class="drill-pill" onclick="_startDrill('cubes')">³&nbsp; Cubes</button>
          <button class="drill-pill" onclick="_startDrill('formulas')">∫&nbsp; Formulas</button>
          <button class="drill-pill drill-pill-gk" onclick="_startDrill('gk')">🌍 Today's GK</button>
        </div>
      </div>

      <div id="goals-list" class="goals-list">
        <p class="text-muted">Loading goals…</p>
      </div>

      <div id="partner-footer-wrap"></div>

      </div><!-- /home-content -->

      <div class="city-strip hidden" id="city-strip">
        <span class="city-strip-dot">📍</span>
        <span class="city-strip-text" id="city-strip-text"></span>
      </div>


      <!-- ── Navigation Drawer ──────────────────────────────── -->
      <div class="app-drawer" id="app-drawer">
        <div class="drawer-overlay" id="drawer-overlay" onclick="_closeDrawer()"></div>
        <div class="drawer-panel">
          <div class="drawer-header">
            <div class="drawer-brand">
              <img src="assets/icon.svg" class="drawer-logo" alt="Donnibo">
              <span class="drawer-brand-name">Donnibo</span>
            </div>
            <button class="drawer-close" onclick="_closeDrawer()" aria-label="Close menu">✕</button>
          </div>
          <nav class="drawer-nav">
            <button class="drawer-item" onclick="_startDrill('tables');_closeDrawer()">
              <span class="drawer-icon">⚡</span>
              <span class="drawer-label">Flash Drills</span>
            </button>
            <button class="drawer-item" id="drawer-practice-btn" onclick="_navPractice();_closeDrawer()">
              <span class="drawer-icon">📖</span>
              <span class="drawer-label">Practice</span>
            </button>
            <button class="drawer-item" onclick="_setSubjectFilter('gk');_renderHome();_closeDrawer()">
              <span class="drawer-icon">🌍</span>
              <span class="drawer-label">Today's GK</span>
            </button>
            <button class="drawer-item" onclick="openSettings();_closeDrawer()">
              <span class="drawer-icon">⚙️</span>
              <span class="drawer-label">Settings</span>
            </button>
            <button class="drawer-item" onclick="signOut()">
              <span class="drawer-icon">↩</span>
              <span class="drawer-label">Sign Out</span>
            </button>
          </nav>
          <div class="drawer-footer" id="drawer-footer"></div>
        </div>
      </div>

    </div>
  </section>
