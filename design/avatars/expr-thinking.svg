<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Thought dots -->
  <circle cx="60" cy="38" r="3" fill="#F59E0B" opacity="0.5"/>
  <circle cx="48" cy="28" r="4.5" fill="#F59E0B" opacity="0.6"/>
  <circle cx="34" cy="16" r="6.5" fill="#F59E0B" opacity="0.35"/>

  <!-- Body -->
  <ellipse cx="100" cy="157" rx="28" ry="23" fill="#4C3D6E"/>
  <ellipse cx="100" cy="157" rx="15" ry="13" fill="#F5E6C8"/>

  <!-- Left arm (raised, chin-tap gesture) -->
  <ellipse cx="80" cy="128" rx="8" ry="16" fill="#4C3D6E" transform="rotate(50 80 128)"/>
  <!-- Right arm (hanging) -->
  <ellipse cx="132" cy="155" rx="8" ry="17" fill="#4C3D6E" transform="rotate(15 132 155)"/>

  <!-- Staff (leaning against body, not held actively) -->
  <rect x="140" y="90" width="5" height="90" rx="2.5" fill="#7C4A1E" opacity="0.6"/>

  <!-- Legs -->
  <ellipse cx="87" cy="177" rx="13" ry="9" fill="#4C3D6E"/>
  <ellipse cx="113" cy="177" rx="13" ry="9" fill="#4C3D6E"/>

  <!-- HEAD -->
  <circle cx="100" cy="75" r="52" fill="#4C3D6E"/>

  <!-- Ears -->
  <ellipse cx="58" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="58" cy="32" rx="7" ry="10" fill="#5D4A80"/>
  <ellipse cx="142" cy="30" rx="13" ry="17" fill="#4C3D6E"/>
  <ellipse cx="142" cy="32" rx="7" ry="10" fill="#5D4A80"/>

  <!-- Snout -->
  <ellipse cx="100" cy="94" rx="18" ry="12" fill="#F5E6C8"/>

  <!-- Eyes: left eye normal, right eye squinted (thinking) -->
  <circle cx="83" cy="72" r="13" fill="#F59E0B"/>
  <circle cx="84" cy="73" r="7.5" fill="#1E1B4B"/>
  <circle cx="87" cy="70" r="3" fill="white" opacity="0.9"/>

  <!-- Right eye squinted -->
  <ellipse cx="117" cy="74" rx="13" ry="8" fill="#F59E0B"/>
  <path d="M 104 70 Q 117 68 130 70" stroke="#4C3D6E" stroke-width="3.5" fill="none"/>
  <ellipse cx="117" cy="75" rx="7" ry="5" fill="#1E1B4B"/>
  <circle cx="120" cy="73" r="2" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="100" cy="91" rx="6.5" ry="4.5" fill="#3D2B5E"/>

  <!-- Mouth (slight purse — thinking hmm) -->
  <path d="M 94 101 Q 100 103 106 101" stroke="#3D2B5E" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Bandana -->
  <rect x="74" y="120" width="52" height="9" rx="3" fill="#E74C3C"/>
  <path d="M 126 120 L 133 129 L 126 129" fill="#C0392B"/>
</svg>
