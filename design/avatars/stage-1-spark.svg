<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbFill" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6B5490"/>
      <stop offset="100%" stop-color="#4C3D6E"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow halo -->
  <circle cx="100" cy="100" r="95" fill="url(#outerGlow)"/>

  <!-- Orb body -->
  <circle cx="100" cy="100" r="60" fill="url(#orbFill)"/>

  <!-- Orb edge glow ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.75" filter="url(#glow)"/>

  <!-- Eyes peeking from inside orb -->
  <circle cx="84" cy="97" r="12" fill="#F59E0B"/>
  <circle cx="116" cy="97" r="12" fill="#F59E0B"/>
  <circle cx="86" cy="99" r="6.5" fill="#1E1B4B"/>
  <circle cx="118" cy="99" r="6.5" fill="#1E1B4B"/>
  <circle cx="89" cy="95" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="121" cy="95" r="2.5" fill="white" opacity="0.9"/>

  <!-- Dashed orbit ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="6,5" opacity="0.35"/>

  <!-- Floating sparkles -->
  <circle cx="52" cy="58" r="3.5" fill="#22D3EE" opacity="0.65"/>
  <circle cx="148" cy="52" r="2.5" fill="#F59E0B" opacity="0.70"/>
  <circle cx="153" cy="143" r="3" fill="#22D3EE" opacity="0.55"/>
  <circle cx="47" cy="148" r="2" fill="#22D3EE" opacity="0.60"/>
  <circle cx="100" cy="30" r="2" fill="#F59E0B" opacity="0.50"/>
</svg>
